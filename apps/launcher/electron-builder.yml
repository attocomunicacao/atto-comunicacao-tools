appId: br.com.attocomunicacao.tools.launcher
productName: ATTO Launcher
copyright: © 2026 Atto Comunicação
directories:
  output: ../../dist/launcher
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: x64
  artifactName: ATTO-Tools-Setup-${version}.${ext}
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false # instala só para o usuário, sem pedir administrador
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ATTO Tools
  runAfterFinish: true
  deleteAppDataOnUninstall: false # a pasta com o ATTO Tools instalado e os projetos permanece
electronVersion: 45.2.3
extraMetadata:
  name: atto-launcher
